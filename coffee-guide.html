<style>:root{--bg:#F0EFEB;--card:#FAF9F6;--ink:#3A3835;--sub:#67635C;--line:#DDDBD5;--acc:#A9B8A0;--acc-strong:#8FA285;--acc-ink:#536149;--on-acc:#2F332B;--acc2:#E2E8DC;--acc3:#EEF2EA;--peach:#EED9CC;--blush:#EBD8DE;--cream:#F5EBCD;--sky:#D4E4F1;--lilac:#D9D1DA;--grey:#D4D4D4;--r:18px}
*{box-sizing:border-box}html,body{margin:0;background:#E6E4DF}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:40px}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:rgba(240,239,235,.95);backdrop-filter:blur(6px);display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:56px}
.back{border:0;background:none;font-size:17px;min-height:44px;padding:0 10px;border-radius:12px;color:var(--acc-ink);font-weight:600}

.pad{padding:20px}
.brand{text-align:center;padding:64px 20px 28px}.brand .logo{color:var(--acc-ink);font-weight:800;letter-spacing:.08em;font-size:15px}
.brand h1{font-size:32px;margin:8px 0 6px}.brand p{color:var(--sub);margin:0}
.bigbtn{display:block;width:100%;text-align:left;border:0;border-radius:var(--r);padding:26px 22px;margin:0 0 14px;background:var(--card);box-shadow:0 2px 10px rgba(0,0,0,.05);font-size:21px;font-weight:700}
.bigbtn small{display:block;font-size:15px;font-weight:400;color:var(--sub);margin-top:4px}
.bigbtn.primary{background:var(--acc);color:var(--on-acc)}.bigbtn.primary small{color:var(--on-acc)}
.progress{display:flex;gap:6px;margin:4px 0 22px}.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}.progress i.on{background:var(--acc)}
.q{font-size:24px;font-weight:800;margin:0 0 6px;line-height:1.35}.qsub{color:var(--sub);margin:0 0 20px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2px solid transparent;background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:12px;min-height:64px;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.opt:active,.opt.sel{border-color:var(--acc)}.opt b{display:block;font-size:18px}.opt span{color:var(--sub);font-size:15px}
.opt .num{flex:none;width:40px;height:40px;border-radius:50%;background:var(--acc2);color:var(--acc-ink);display:grid;place-items:center;font-weight:800}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.bean{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:0;background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.04);min-height:84px}
.bean img{width:64px;height:78px;object-fit:cover;border-radius:12px;background:#ddd;flex:none}
.bean b{display:block;font-size:17px}.bean span{color:var(--sub);font-size:14px}
.rank{font-size:13px;font-weight:800;color:var(--acc-ink)}.why{font-size:14px;color:var(--acc-ink);margin-top:4px;display:block}
.sec{font-size:15px;font-weight:800;color:var(--acc-ink);margin:26px 0 10px;letter-spacing:.02em}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:0 16px;min-height:44px;white-space:nowrap;font-size:15px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:700}
.hero{background:#2f2f2f;text-align:center}.hero img{width:auto;max-width:100%;height:300px;object-fit:contain;display:block;margin:0 auto}
.dname{font-size:26px;font-weight:800;margin:16px 0 0}.den{color:var(--sub);font-size:14px;letter-spacing:.06em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.tag{background:var(--sky);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.tabs{display:flex;background:#E4E2DC;border-radius:14px;padding:4px;margin:18px 0 6px}
.tabs button{flex:1;border:0;background:none;min-height:44px;border-radius:11px;font-weight:700;color:var(--sub)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.meter{display:flex;align-items:center;gap:12px;margin:8px 0}.meter label{width:110px;font-size:15px;flex:none}
.bar{flex:1;display:flex;gap:4px}.bar i{flex:1;height:10px;border-radius:5px;background:var(--line)}.bar i.on{background:var(--acc-strong)}
.meter em{font-style:normal;color:var(--sub);font-size:13px;width:28px;text-align:right}
.roast{display:flex;gap:4px;margin:10px 0 4px}.roast i{flex:1;height:14px;border-radius:4px;opacity:.35}.roast i.on{opacity:1;outline:3px solid var(--acc-strong);outline-offset:1px}
.roastlbl{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kv div{background:var(--bg);border-radius:12px;padding:12px}.kv small{display:block;color:var(--sub);font-size:13px}.kv b{font-size:16px}
.steps{list-style:none;padding:0;margin:14px 0 0}.steps li{display:flex;gap:12px;padding:12px;border-radius:12px;margin-bottom:6px;background:var(--bg);transition:.2s}
.steps li.cur{background:var(--acc);color:var(--on-acc)}.steps li.done{opacity:.5}.steps .t{font-weight:800;width:54px;flex:none;font-variant-numeric:tabular-nums}
.timer{text-align:center;margin-top:16px}.timer .clock{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
.timer button{min-height:48px;min-width:96px;border-radius:14px;border:0;margin:4px;font-weight:700;background:#E4E2DC}.timer button.go{background:var(--acc);color:var(--on-acc)}
.sample{background:var(--cream);color:#5E4B1A;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.empty{text-align:center;padding:40px 16px;color:var(--sub)}.empty .ico{font-size:40px}
.desc{color:#4A473F}.muted{color:var(--sub);font-size:14px}
.btn2{display:block;width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--acc);background:#fff;color:var(--acc-ink);font-weight:700;margin-top:10px}
.possum{background:var(--acc);color:var(--on-acc);border-radius:14px;padding:12px 14px;font-weight:700;margin:14px 0 12px;font-size:15px}
.sn{color:var(--acc-ink);font-family:Georgia,serif;margin-right:4px}
.lhead{display:grid;grid-template-columns:52px 1fr 64px;font-size:12px;color:var(--sub);padding:0 6px 6px;border-bottom:1px solid var(--line)}.lhead span:nth-child(2){text-align:center}
.lad{max-height:330px;overflow-y:auto;position:relative;padding:4px 0}
.lr{display:grid;grid-template-columns:14px 38px 1fr auto;align-items:center;gap:0;padding:5px 6px;border-radius:10px;opacity:.55;font-size:15px}
.lr .ld{width:10px;height:10px;border-radius:50%}.lr .lk{font-size:12px;color:var(--sub);font-family:Georgia,serif}.lr .ln{text-align:center}
.lr.me{opacity:1;background:var(--acc2);font-weight:800;outline:2px solid var(--acc)}.lr.me .ld{transform:scale(1.5)}
.dots{display:flex;gap:3px}.dots i{width:9px;height:9px;border-radius:50%;border:1px solid #B8AE98}.dots i.f1{background:#C9BC94}.dots i.f2{background:#B39A6C}.dots i.f3{background:#8D6B45}.dots i.f4{background:#4A3426}
.rs{border-radius:14px;padding:12px;margin-bottom:8px;opacity:.5;border:1.5px solid var(--line)}.rs.on{opacity:1;border-color:var(--acc);background:var(--acc3)}
.rt{display:flex;gap:8px;align-items:center}.rb{background:var(--acc2);color:var(--acc-ink);font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px}.rs.on .rb{background:var(--acc);color:var(--on-acc)}
.rc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.rc span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}.rc em{font-style:normal;color:var(--acc-ink);font-weight:800;margin-right:4px}
.rc span.me{background:var(--acc);color:var(--on-acc);border-color:var(--acc);font-weight:800}.rc span.me em{color:var(--on-acc)}
.multi{display:inline-block;font-size:11px;font-weight:700;color:#2F2A26;background:linear-gradient(90deg,#E3A396,#A88470);border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:middle}

.buy{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;background:var(--acc);color:var(--on-acc);font-weight:800;text-decoration:none;font-size:17px}
.buy.off{background:#E3DED2;color:#8C877B;cursor:not-allowed}
.buy.sm{min-height:44px;font-size:15px;margin:-4px 0 14px}
.buybar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(240,239,235,.96);border-top:1px solid var(--line);z-index:6}
.wrap.hasbar{padding-bottom:110px}

.menu .bar i.on{background:var(--acc)}
.rs.s1{background:var(--peach)}.rs.s2{background:var(--cream)}.rs.s3{background:var(--blush)}.rs.s4{background:var(--lilac)}
.rs{opacity:.55;border-color:transparent}.rs.on{opacity:1;border-color:var(--acc);border-width:2px}.rs.on.s1,.rs.on.s2,.rs.on.s3,.rs.on.s4{box-shadow:0 2px 10px rgba(0,0,0,.06)}
.rb{background:rgba(255,255,255,.7);color:var(--ink)}
.sec.st1{border-left:6px solid var(--peach);padding-left:8px}.sec.st2{border-left:6px solid var(--cream);padding-left:8px}.sec.st3{border-left:6px solid var(--blush);padding-left:8px}.sec.st4{border-left:6px solid var(--lilac);padding-left:8px}

.bigbtn{background:var(--card)}
.kv div{background:var(--bg)}
.sample{border:1px solid #E7D9A8}

.wopt{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 18px;border-radius:14px;margin-bottom:10px;background:var(--acc);color:var(--on-acc);text-decoration:none;font-size:17px}

.rmarrow{text-align:center;color:var(--sub);font-size:20px;line-height:28px}

.agrad{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,#F0C9A0,#E2B887,#C99B6E,#9C7356,#6B4E3D);margin:0 2px 14px}

.scard img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px;margin:6px 0 8px;background:#ddd}
.scard b{font-size:16px;line-height:1.3}.srank{font-size:13px;font-weight:800;color:var(--acc-ink)}.skw{font-size:13px;color:var(--sub);margin-top:2px}
.schar{margin-top:6px;font-size:12px;font-weight:700;background:var(--acc2);color:var(--acc-ink);border-radius:999px;padding:2px 9px}
.hrow{display:flex;gap:12px}.bigbtn.half{flex:1;font-size:18px;padding:22px 16px}
</style>
